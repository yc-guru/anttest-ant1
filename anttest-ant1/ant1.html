<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chinese Test - 厚</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        .test-item {
            margin: 20px 0;
            font-size: 20px;
        }
        .chinese-char {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }
        .options {
            font-size: 18px;
            color: #333;
            margin-top: 10px;
        }
        .option {
            padding: 15px 30px;
            margin: 10px 0;
            background: #f0f0f0;
            border: 2px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 18px;
        }
        .option:hover {
            background: #e0e0e0;
            transform: scale(1.05);
        }
        .option.selected {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        .option.correct {
            background: #4caf50;
            color: white;
            border-color: #4caf50;
        }
        .option.incorrect {
            background: #f44336;
            color: white;
            border-color: #f44336;
        }
        .result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            display: none;
        }
        .result.show {
            display: block;
        }
        .result.correct {
            color: #4caf50;
        }
        .result.incorrect {
            color: #f44336;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Chinese Test</h1>
        <div class="test-item">
            <div class="chinese-char">厚</div>
            <div class="options">
                <div class="option" onclick="selectAnswer('A')"><strong>A:</strong> hou</div>
                <div class="option" onclick="selectAnswer('B')"><strong>B:</strong> gua</div>
            </div>
            <div class="result" id="result"></div>
        </div>
    </div>

    <script>
        const correctAnswer = 'A'; // hou is the correct pronunciation for 厚

        function selectAnswer(answer) {
            // Remove previous selections
            document.querySelectorAll('.option').forEach(option => {
                option.classList.remove('selected', 'correct', 'incorrect');
            });

            // Get the clicked option
            const options = document.querySelectorAll('.option');
            let clickedOption;
            if (answer === 'A') {
                clickedOption = options[0];
            } else {
                clickedOption = options[1];
            }

            // Show result
            const resultDiv = document.getElementById('result');
            resultDiv.classList.add('show');

            if (answer === correctAnswer) {
                clickedOption.classList.add('correct');
                resultDiv.classList.remove('incorrect');
                resultDiv.classList.add('correct');
                resultDiv.textContent = '✓ Correct!';
            } else {
                clickedOption.classList.add('incorrect');
                resultDiv.classList.remove('correct');
                resultDiv.classList.add('incorrect');
                resultDiv.textContent = '✗ Incorrect! The correct answer is A: hou';
            }
        }

        // Disable right-click
        document.addEventListener('contextmenu', function(event) {
            event.preventDefault();
            return false;
        });

        // Disable F12
        document.addEventListener('keydown', function(event) {
            if (event.keyCode === 123) {
                event.preventDefault();
                return false;
            }
            // Disable Ctrl+Shift+I
            if (event.ctrlKey && event.shiftKey && event.keyCode === 73) {
                event.preventDefault();
                return false;
            }
            // Disable Ctrl+Shift+C
            if (event.ctrlKey && event.shiftKey && event.keyCode === 67) {
                event.preventDefault();
                return false;
            }
        });

        // Disable developer tools detection
        setInterval(function() {
            if (window.outerHeight - window.innerHeight > 200) {
                document.body.innerHTML = '';
            }
        }, 500);
    </script>
</body>
</html>
